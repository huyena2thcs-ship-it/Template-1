<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đêm Hội Trăng Rằm - Digital Photobooth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      font-family: 'Courier New', Courier, monospace;
      color: #f0f4f8;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* BACKGROUND: SAO, TRĂNG, ĐÈN LỒNG, THỎ NGỌC */
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
      background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 40px 70px, #ffd700, rgba(0,0,0,0)),
                  radial-gradient(1.5px 1.5px at 150px 120px, #fff, rgba(0,0,0,0)),
                  radial-gradient(2px 2px at 280px 190px, #ffd700, rgba(0,0,0,0));
      background-size: 300px 300px; animation: twinkle 4s infinite ease-in-out; opacity: 0.8; z-index: 0;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .moon {
      position: fixed; top: 15px; right: 15px; width: 75px; height: 75px;
      background: radial-gradient(circle at 35% 35%, #fffdf0, #ffe169, #d4af37);
      border-radius: 50%; box-shadow: 0 0 35px rgba(255, 225, 105, 0.9); z-index: 1;
    }

    .lantern {
      position: fixed; top: 0; left: 15px; width: 40px; height: 60px;
      background: linear-gradient(to bottom, #ff4d4d, #cc0000);
      border-radius: 18px; box-shadow: 0 0 20px rgba(255, 77, 77, 0.8);
      animation: swing 3s infinite ease-in-out alternate; z-index: 2; transform-origin: top center;
    }
    .lantern::before { content: ''; position: absolute; top: -10px; left: 16px; width: 8px; height: 10px; background: #ffd700; }
    .lantern::after { content: ''; position: absolute; bottom: -12px; left: 17px; width: 6px; height: 12px; background: #ffd700; }
    @keyframes swing { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }

    .rabbit {
      position: fixed; bottom: 10px; left: 10px; width: 60px; height: 60px; z-index: 2; pointer-events: none; opacity: 0.9;
    }

    /* BƯỚC 1: MÀN HÌNH BỨC THƯ */
    .envelope-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 10, 15, 0.95);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 999; transition: opacity 0.8s ease;
    }

    .envelope {
      width: 270px; height: 170px; background: #d44235; border-radius: 10px;
      position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      cursor: pointer; display: flex; justify-content: center; align-items: center;
      animation: floatEnv 3s infinite ease-in-out; border: 2px solid #ffd700;
    }
    @keyframes floatEnv { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .envelope-seal {
      width: 48px; height: 48px; background: #ffd700; border-radius: 50%;
      display: flex; justify-content: center; align-items: center; color: #d44235;
      font-weight: bold; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .envelope-hint {
      margin-top: 25px; color: #ffe169; font-size: 13px; letter-spacing: 1px;
      animation: pulse 1.5s infinite; text-align: center; padding: 0 10px;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* BƯỚC 2: PHOTOBOOTH BỐ CỤC 1 TO - NHIỀU BÉ */
    .main-app {
      width: 100%; opacity: 0; pointer-events: none; transition: opacity 1s ease;
      display: flex; flex-direction: column; align-items: center; z-index: 5; padding-bottom: 40px;
    }
    .main-app.active { opacity: 1; pointer-events: auto; }

    .music-player {
      width: 90%; max-width: 850px; background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.4); color: #ffe169; padding: 8px 16px;
      margin: 15px 0 20px 0; border-radius: 25px; display: flex; justify-content: space-between;
      align-items: center; backdrop-filter: blur(8px);
    }

    .play-btn {
      background: #f7b731; border: none; color: #0b1d3a; padding: 6px 14px;
      border-radius: 18px; cursor: pointer; font-weight: bold; font-size: 11px;
    }

    /* GRID PHÁ CÁCH */
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      gap: 12px;
      width: 92%;
      max-width: 950px;
    }

    .column { display: flex; flex-direction: column; gap: 12px; }

    .photo-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 8px 18px 8px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }

    .img-box {
      width: 100%;
      background-color: #e2e8f0;
      overflow: hidden;
      border-radius: 4px;
    }

    .img-box img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity 0.7s ease, transform 0.7s ease;
      opacity: 1;
    }

    .img-box img.swapping {
      opacity: 0;
      transform: scale(0.85);
    }

    /* ĐA DẠNG KÍCH THƯỚC KHUNG MẶC ĐỊNH (MÁY TÍNH) */
    .size-mini { height: 95px; }    
    .size-small { height: 130px; }  
    .size-huge { height: 260px; }   

    .caption {
      text-align: center; font-size: 10px; font-weight: bold; color: #0b1d3a;
      margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }

    .main-card {
      text-align: center; padding: 12px; display: flex; flex-direction: column; justify-content: space-between;
    }

    .date-badge {
      font-size: 10px; border-top: 1px solid #d4af37; border-bottom: 1px solid #d4af37;
      padding: 3px 0; color: #b8860b; font-weight: bold; margin-bottom: 6px;
    }

    .letter { font-style: italic; font-size: 11px; line-height: 1.5; color: #334155; margin: 6px 0; }

    /* ĐIỀU CHỈNH RIÊNG CHO MÀN HÌNH ĐIỆN THOẠI (<768px) */
    @media (max-width: 768px) {
      /* Thu hẹp chiều rộng cả bộ khung xuống 80% để lộ hai bên lề background */
      .gallery-grid { 
        grid-template-columns: 1fr; 
        gap: 12px; 
        width: 82%; 
      }
      /* Thu nhỏ chiều cao các ô ảnh trên mobile */
      .size-mini { height: 100px; }
      .size-small { height: 130px; }
      .size-huge { height: 170px; }
      
      .moon { width: 55px; height: 55px; top: 10px; right: 10px; }
      .lantern { width: 30px; height: 45px; }
      .rabbit { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>

  <div class="stars"></div>
  <div class="moon"></div>
  <div class="lantern"></div>

  <!-- Thỏ Ngọc SVG -->
  <svg class="rabbit" viewBox="0 0 100 100">
    <ellipse cx="50" cy="65" rx="25" ry="20" fill="#ffffff"/>
    <circle cx="50" cy="40" r="15" fill="#ffffff"/>
    <ellipse cx="43" cy="18" rx="4" ry="12" fill="#ffffff"/>
    <ellipse cx="57" cy="18" rx="4" ry="12" fill="#ffffff"/>
    <ellipse cx="43" cy="18" rx="2" ry="8" fill="#ffccd5"/>
    <ellipse cx="57" cy="18" rx="2" ry="8" fill="#ffccd5"/>
    <circle cx="45" cy="38" r="2" fill="#000"/>
    <circle cx="55" cy="38" r="2" fill="#000"/>
    <circle cx="50" cy="42" r="1.5" fill="#ff8080"/>
  </svg>

  <!-- MÀN HÌNH BỨC THƯ -->
  <div class="envelope-screen" id="envScreen">
    <div class="envelope" onclick="openEnvelope()">
      <div class="envelope-seal">🌕</div>
    </div>
    <div class="envelope-hint">✨ Nhấp vào phong thư để mở món quà Trung Thu ✨</div>
  </div>

  <!-- PHOTOBOOTH CHÍNH -->
  <div class="main-app" id="mainApp">
    
    <div class="music-player">
      <div class="music-info">🌕 Thằng Cuội (Acoustic) 🎶</div>
      <button class="play-btn" id="playBtn" onclick="toggleAudio()">⏸ PAUSE</button>
    </div>

    <audio id="bgmusic" loop preload="auto">
      <source src="music/thangcuoi.mp3" type="audio/mpeg">
      <source src="https://ia801503.us.archive.org/15/items/ThangCuoiAcoustic/ThangCuoi.mp3" type="audio/mpeg">
    </audio>

    <div class="gallery-grid">
      
      <!-- CỘT 1 -->
      <div class="column">
        <div class="photo-card">
          <div class="img-box size-mini">
            <img class="rot-img" src="image/anh1.jpg" onerror="smartFix(this, 'anh1')">
          </div>
          <div class="caption">Trăng Rằm 🌕</div>
        </div>

        <div class="photo-card">
          <div class="img-box size-small">
            <img class="rot-img" src="image/anh2.jpg" onerror="smartFix(this, 'anh2')">
          </div>
          <div class="caption">Đèn Lồng 🏮</div>
        </div>

        <div class="photo-card">
          <div class="img-box size-mini">
            <img class="rot-img" src="image/anh3.jpg" onerror="smartFix(this, 'anh3')">
          </div>
          <div class="caption">Ký Ức ✨</div>
        </div>
      </div>

      <!-- CỘT 2 (TRUNG TÂM) -->
      <div class="column">
        <div class="photo-card main-card">
          <div>
            <div class="date-badge">MID-AUTUMN FESTIVAL 🌕</div>
            <h2 style="font-size:13px; margin:3px 0; color:#0b1d3a;">ĐÊM HỘI TRĂNG RẰM</h2>
            <p class="letter">"Bóng trăng trắng ngà, có cây đa to, có thằng Cuội già ôm một mối mơ..."</p>
          </div>
          
          <div class="img-box size-huge">
            <img class="rot-img" src="image/anhchinh.jpg" onerror="smartFix(this, 'anhchinh')">
          </div>
        </div>
      </div>

      <!-- CỘT 3 -->
      <div class="column">
        <div class="photo-card">
          <div class="img-box size-small">
            <img class="rot-img" src="image/anh4.jpg" onerror="smartFix(this, 'anh4')">
          </div>
          <div class="caption">Chị Hằng ✨</div>
        </div>

        <div class="photo-card">
          <div class="img-box size-mini">
            <img class="rot-img" src="image/anh5.jpg" onerror="smartFix(this, 'anh5')">
          </div>
          <div class="caption">Tháng Tám 🥮</div>
        </div>

        <div class="photo-card">
          <div class="img-box size-small">
            <img class="rot-img" src="image/anh6.jpg" onerror="smartFix(this, 'anh6')">
          </div>
          <div class="caption">Yêu Thương ❤️</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let rotateTimer = null;

    function openEnvelope() {
      const envScreen = document.getElementById('envScreen');
      const mainApp = document.getElementById('mainApp');
      const audio = document.getElementById('bgmusic');

      envScreen.style.opacity = '0';
      setTimeout(() => {
        envScreen.style.display = 'none';
        mainApp.classList.add('active');
        startImageRotation();
      }, 800);

      audio.play().then(() => {
        document.getElementById('playBtn').innerHTML = '⏸ PAUSE';
      }).catch(err => console.log(err));
    }

    function startImageRotation() {
      if (rotateTimer) return;

      rotateTimer = setInterval(() => {
        const imgs = document.querySelectorAll('.rot-img');
        if (imgs.length < 2) return;

        imgs.forEach(img => img.classList.add('swapping'));

        setTimeout(() => {
          let sources = Array.from(imgs).map(img => img.src);
          let last = sources.pop();
          sources.unshift(last);

          imgs.forEach((img, i) => {
            img.src = sources[i];
          });

          imgs.forEach(img => img.classList.remove('swapping'));
        }, 700);

      }, 4000);
    }

    function smartFix(img, name) {
      const exts = ['.JPG', '.png', '.PNG', '.jpeg', '.JPEG', '.webp'];
      let step = parseInt(img.dataset.step || "0");
      if (step < exts.length) {
        img.dataset.step = step + 1;
        img.src = 'image/' + name + exts[step];
      } else {
        img.onerror = null;
      }
    }

    function toggleAudio() {
      var audio = document.getElementById('bgmusic');
      var btn = document.getElementById('playBtn');

      if (audio.paused) {
        audio.play().then(() => { btn.innerHTML = '⏸ PAUSE'; });
      } else {
        audio.pause();
        btn.innerHTML = '▶ PLAY';
      }
    }
  </script>
</body>
</html>
